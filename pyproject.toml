[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "senec-connect-api"
version = "0.1.0"
description = "Async Python client for the SENEC.Connect cloud API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "SENEC Connect API contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Repository = "https://github.com/MiHechtel/senec-connect-api"
Issues = "https://github.com/MiHechtel/senec-connect-api/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/senec_connect_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
